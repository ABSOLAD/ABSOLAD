name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run password generator tests
        working-directory: python/password-generator
        run: python -m unittest discover -s tests -v
      - name: Run expense tracker tests
        working-directory: python/expense-tracker
        run: python -m unittest discover -s tests -v

  java-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile student records
        working-directory: java/student-records
        run: javac Main.java
